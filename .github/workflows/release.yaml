# Release = push a tag vX.Y.Z on main. Builds and pushes the image, then writes deploy/ from that
# tag (with the new image tag) to the `deploy` branch, which Argo CD deploys. Bot commits never
# land on main.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # push the deploy branch
  packages: write   # push to ghcr.io
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/code-immortal/website
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: docker/setup-qemu-action@v3 
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ env.IMAGE }}:${{ github.ref_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the deploy branch
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git checkout -B deploy origin/deploy
          else
            git checkout --orphan deploy
            git rm -r -q --cached . && git clean -fdq
          fi
          rm -rf deploy
          git checkout "$tag" -- deploy
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 $tag|" deploy/kustomization.yaml
          kubectl kustomize deploy > /dev/null
          git add -A deploy
          git diff --cached --quiet && { echo "deploy branch already at $tag"; exit 0; }
          git commit -q -m "release $tag"
          git push origin deploy
